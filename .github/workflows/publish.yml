# publish.yml — the ONE GitHub Actions workflow in this repository.
#
# Rule 13 carve-out (this project is otherwise local-first: hooks run tests,
# lint, typecheck, build, and the prod-audit gate on the developer's own
# machine before every commit/push; there is no CI-gated merge queue and no
# GitHub PR flow). This workflow exists SOLELY because npm trusted
# publishing and `npm publish --provenance` both require GitHub-hosted OIDC
# (npm accepts no local identity for either) — it is not a deploy gate, not
# a test runner, and not a required check on any branch. It NEVER triggers
# on push or pull_request. It is dispatched by hand, once, when a maintainer
# has already run the full local gate (typecheck + unit + e2e + build +
# quickstart + npm pack --dry-run + prod audit — see CONTRIBUTING.md) and
# decided a version is ready to publish.
#
# Authentication is npm trusted publishing: npm exchanges this job's OIDC
# token (`id-token: write`) for a short-lived publish credential, so no npm
# token is stored in this repository and none can expire. It works only
# while the package's trusted publisher on npmjs.com names owner
# `nipun-arora`, repository `cool-astro-forms`, workflow `publish.yml`, no
# environment, with `npm publish` among the allowed actions. Trusted
# publishing needs npm >= 11.5.1 and Node >= 22.14.0: Node 24.21.0 ships
# npm 11.19.0. GitHub-hosted runners only (npm rejects self-hosted ones).
#
# npm publish itself, GitHub repository creation, and the npm account name
# are all owner-gated actions outside this phase's scope — this workflow
# makes publishing POSSIBLE, it does not publish anything by existing.

name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm you have already run the full local gate (see CONTRIBUTING.md) and reviewed the pre-publish security checklist.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.event.inputs.confirm == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Show toolchain
        run: node --version && npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -w packages/astro-forms

      - name: Publish with provenance (trusted publishing, no token)
        run: npm publish --provenance --access public -w packages/astro-forms
